name: devloop-core

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: devloop
      POSTGRES_PASSWORD: devloop
      POSTGRES_DB: devloop
    ports:
      # 只发布到回环，供宿主机直跑服务端/测试时连接
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - devloop-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devloop -d devloop"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 开发：后端进容器（node --watch 热重启），前端仍在宿主机跑 pnpm dev
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: devloop-core:dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEVLOOP_PORT:-8787}:8787"
    environment:
      DEVLOOP_HOST: 0.0.0.0
      DEVLOOP_PORT: "8787"
      DEVLOOP_TOKEN: "${DEVLOOP_TOKEN:-dev-local-token}"
      DATABASE_URL: "postgres://devloop:devloop@postgres:5432/devloop"
    volumes:
      # 源码与运行时产物（data/ repos/ worktrees/ archive/）都用宿主机目录，便于直接看证据
      - ./:/app
    working_dir: /app
    command: ["node", "--watch", "server/index.mjs"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 生产镜像（本地验证部署形态）：docker compose --profile prod up --build
  api-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: devloop-core:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROD_PORT:-8788}:8787"
    environment:
      DEVLOOP_HOST: 0.0.0.0
      DEVLOOP_TOKEN: "${DEVLOOP_TOKEN:-dev-local-token}"
      DATABASE_URL: "postgres://devloop:devloop@postgres:5432/devloop"
    volumes:
      - devloop-data:/app/data
    restart: unless-stopped

volumes:
  devloop-pg:
  devloop-data:
