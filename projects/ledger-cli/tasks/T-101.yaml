id: T-101
title: 金额契约：校验、格式化与解析
requirement: REQ-100
autonomy: auto
depends_on: []
objective: |
  在 internal/money/amount.go 实现 New / Format / Parse：
  - New：币种必须是非空的三位大写字母，否则返回错误
  - Format："USD 12.34"；负数 "-USD 0.05"；0 为 "USD 0.00"
  - Parse：解析带币种的字符串；缺少币种或格式错误返回错误
  不得修改任何 _test.go 文件。
scope:
  write:
    - internal/money/amount.go
  deny:
    - "**/*_test.go"
acceptance: [AC-1, AC-2, AC-3]
verify:
  - build
  - lint
  - go test ./internal/money -run "Test(New|Format|Parse)"
