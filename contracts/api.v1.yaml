openapi: 3.1.0
info:
  title: devloop API
  version: "1.0.0"
  description: |
    自动化开发平台的 HTTP 契约 v1。
    所有响应都是信封结构 {data, meta}，错误是 {error, meta}。
    面板所需的一切派生状态（任务状态、DAG 层级、证据链）都由服务端计算，客户端不重算。

servers:
  - url: http://127.0.0.1:8787

security:
  - bearer: []

tags:
  - name: meta
  - name: projects
  - name: cards
  - name: runs
  - name: evidence
  - name: agents
  - name: events

paths:
  /api/v1/health:
    get:
      tags: [meta]
      security: []
      summary: 健康检查（不需要鉴权）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }

  /api/v1/projects:
    get:
      tags: [projects]
      summary: 列出已接入项目
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListEnvelope" }
    post:
      tags: [projects]
      summary: 接入新仓库（服务端解析配置并落库）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [projects]
      summary: 项目详情（含门禁来源与统计）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/config:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [projects]
      summary: 解析后的项目配置快照（客户端只读）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectConfigEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/panel:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [projects]
      summary: 面板聚合数据（流程视图的唯一数据源）
      description: |
        返回需求列表、流程节点与边、以及最近事件。**所有业务状态在此计算完毕**，
        客户端只负责布局与渲染。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/requirements:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [cards]
      summary: 项目下的需求卡列表
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementListEnvelope" }

  /api/v1/requirements/{requirementId}:
    parameters:
      - { $ref: "#/components/parameters/RequirementId" }
    get:
      tags: [cards]
      summary: 需求卡详情
      responses:
        "200":
          description: ok
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cards]
      summary: 编辑需求卡（乐观锁）
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequirementUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/requirements/{requirementId}/dag:
    parameters:
      - { $ref: "#/components/parameters/RequirementId" }
    get:
      tags: [cards]
      summary: 需求的任务 DAG（含层级、状态、证据关联）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DagEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    get:
      tags: [cards]
      summary: 任务卡详情
      responses:
        "200":
          description: ok
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cards]
      summary: 编辑任务卡（乐观锁）
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/tasks/{taskId}/runs:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    get:
      tags: [runs]
      summary: 任务的执行历史
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunListEnvelope" }
    post:
      tags: [runs]
      summary: 触发一次执行（服务端按执行策略决定是否放行）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCreate" }
      responses:
        "202":
          description: 已接受
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        "403": { $ref: "#/components/responses/PolicyDenied" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/runs/{runId}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [runs]
      summary: 执行详情（含各阶段退出码与日志证据指针）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/runs/{runId}/evidence:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [evidence]
      summary: 该次执行的证据清单（含 sha256，可校验）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceListEnvelope" }

  /api/v1/evidence/{evidenceId}/content:
    parameters:
      - { $ref: "#/components/parameters/EvidenceId" }
    get:
      tags: [evidence]
      summary: 证据原文（diff / 日志 / 结果 JSON）
      description: 返回 text/plain；`X-Evidence-Sha256` 头可用来校验完整性。
      responses:
        "200":
          description: ok
          headers:
            X-Evidence-Sha256:
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agent-config:
    get:
      tags: [agents]
      summary: 服务端下发的 agent 配置与执行策略（客户端只读）
      description: |
        客户端据此渲染"agent 设置"面板，但**不可写回**。用户本地命令/模型的覆盖
        必须作为 `localOverride` 在客户端侧生效，并在触发执行时随请求上报，
        由服务端按 policy 判定是否接受。
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConfigEnvelope" }

  /api/v1/events:
    get:
      tags: [events]
      summary: 增量事件流（面板时间线）
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: 上次拿到的事件 id，只返回更大的
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListEnvelope" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 资源的 ETag，形如 "v3"
      schema: { type: string }

  headers:
    ETag:
      schema: { type: string }
      description: 形如 "v3"

  responses:
    BadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: 版本冲突或状态不允许
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationFailed:
      description: 卡片校验失败（DAG/写域/判据）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PolicyDenied:
      description: 被执行策略拒绝（网络、写域、自治等级）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Meta:
      type: object
      required: [apiVersion, requestId]
      properties:
        apiVersion: { type: string, const: v1 }
        requestId: { type: string }
        serverTime: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, unauthorized, not_found, conflict, validation_failed, policy_denied, internal]
        message: { type: string }
        details:
          type: array
          items: { type: string }

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        meta: { $ref: "#/components/schemas/Meta" }

    Health:
      type: object
      required: [status, db, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string }
        version: { type: string }
        counts:
          type: object
          additionalProperties: { type: integer }

    HealthEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Health" }
        meta: { $ref: "#/components/schemas/Meta" }

    Project:
      type: object
      required: [id, name, stack, repoPath, defaultBranch, cardsMode, status]
      properties:
        id: { type: string }
        name: { type: string }
        stack: { type: string }
        repoPath: { type: string }
        defaultBranch: { type: string }
        cardsMode: { type: string, enum: [platform, repo] }
        status: { type: string, enum: [active, paused] }
        schemaVersion: { type: string }
        gates:
          type: object
          required: [build, lint, test]
          properties:
            build: { $ref: "#/components/schemas/Gate" }
            lint: { $ref: "#/components/schemas/Gate" }
            test: { $ref: "#/components/schemas/Gate" }
        stats:
          type: object
          properties:
            requirements: { type: integer }
            tasks: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
        updatedAt: { type: string }

    Gate:
      type: object
      required: [command, source]
      properties:
        command: { type: string }
        source: { type: string, description: "platform | preset:<name> | project" }
        timeoutMs: { type: integer }

    ProjectCreate:
      type: object
      required: [id, repoPath]
      properties:
        id: { type: string }
        name: { type: string }
        stack: { type: string, default: custom }
        repoPath: { type: string }
        defaultBranch: { type: string, default: main }
        cardsMode: { type: string, enum: [platform, repo], default: platform }

    ProjectEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Project" }
        meta: { $ref: "#/components/schemas/Meta" }

    ProjectListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        meta: { $ref: "#/components/schemas/Meta" }

    ProjectConfig:
      type: object
      required: [projectId, version, resolved, sources, sha256]
      properties:
        projectId: { type: string }
        version: { type: integer }
        resolved: { type: object, additionalProperties: true }
        sources: { type: object, additionalProperties: { type: string } }
        sha256: { type: string }
        createdAt: { type: string }

    ProjectConfigEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/ProjectConfig" }
        meta: { $ref: "#/components/schemas/Meta" }

    AcceptanceCriterion:
      type: object
      required: [id, text, verifyBy]
      properties:
        id: { type: string }
        seq: { type: integer }
        text: { type: string }
        verifyBy: { type: string }

    Requirement:
      type: object
      required: [id, projectId, title, status, autonomy, version]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, ready, accepted, archived] }
        autonomy: { type: string, enum: [auto, assisted, human-only] }
        owner: { type: string }
        summary: { type: string }
        version: { type: integer }
        acceptance:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceCriterion" }
        stats:
          type: object
          properties:
            tasks: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
        updatedAt: { type: string }

    RequirementUpdate:
      type: object
      required: [title, status, autonomy, summary, acceptance]
      properties:
        title: { type: string }
        status: { type: string, enum: [draft, ready, accepted, archived] }
        autonomy: { type: string, enum: [auto, assisted, human-only] }
        owner: { type: string }
        summary: { type: string }
        acceptance:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceCriterion" }

    RequirementEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Requirement" }
        meta: { $ref: "#/components/schemas/Meta" }

    RequirementListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Requirement" }
        meta: { $ref: "#/components/schemas/Meta" }

    Task:
      type: object
      required: [id, requirementId, title, autonomy, status, version]
      properties:
        id: { type: string }
        requirementId: { type: string }
        title: { type: string }
        objective: { type: string }
        autonomy: { type: string, enum: [auto, assisted, human-only] }
        status: { type: string, enum: [pending, ready, running, passed, failed, blocked] }
        dagLayer: { type: integer }
        version: { type: integer }
        deps:
          type: array
          items: { type: string }
        scope:
          type: object
          properties:
            write: { type: array, items: { type: string } }
            read: { type: array, items: { type: string } }
            deny: { type: array, items: { type: string } }
        verify:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              ref: { type: string }
              resolvedCommand: { type: string }
        acceptance: { type: array, items: { type: string } }
        latestRun:
          type: object
          nullable: true
          properties:
            id: { type: string }
            status: { type: string }
            attempt: { type: integer }
            finishedAt: { type: string }
        updatedAt: { type: string }

    TaskUpdate:
      type: object
      required: [title, autonomy, objective, scope, verify, acceptance, deps]
      properties:
        title: { type: string }
        autonomy: { type: string, enum: [auto, assisted, human-only] }
        objective: { type: string }
        deps: { type: array, items: { type: string } }
        scope:
          type: object
          properties:
            write: { type: array, items: { type: string } }
            read: { type: array, items: { type: string } }
            deny: { type: array, items: { type: string } }
        verify:
          type: array
          items:
            type: object
            properties:
              ref: { type: string }
              resolvedCommand: { type: string }
        acceptance: { type: array, items: { type: string } }

    TaskEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Task" }
        meta: { $ref: "#/components/schemas/Meta" }

    DagNode:
      type: object
      required: [id, title, status, layer]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [pending, ready, running, passed, failed, blocked] }
        layer: { type: integer }
        deps: { type: array, items: { type: string } }
        latestRunId: { type: string, nullable: true }
        evidenceCount: { type: integer }

    Dag:
      type: object
      required: [requirementId, layers, nodes, edges, stats]
      properties:
        requirementId: { type: string }
        layers:
          type: array
          items: { type: array, items: { type: string } }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/DagNode" }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
        stats:
          type: object
          properties:
            total: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
            blocked: { type: integer }
        validated: { type: boolean }
        validationErrors: { type: array, items: { type: string } }

    DagEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Dag" }
        meta: { $ref: "#/components/schemas/Meta" }

    FlowNode:
      type: object
      required: [id, kind, label, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [requirement, task, run] }
        label: { type: string }
        status: { type: string }
        requirementId: { type: string }
        taskId: { type: string }
        runId: { type: string, nullable: true }
        x: { type: integer, description: "服务端给出的布局坐标（避免客户端各算一套）" }
        y: { type: integer }

    Panel:
      type: object
      required: [projectId, generatedAt, requirements, flow, events]
      properties:
        projectId: { type: string }
        generatedAt: { type: string }
        requirements:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              status: { type: string }
              tasks: { type: integer }
              passed: { type: integer }
        flow:
          type: object
          properties:
            nodes: { type: array, items: { $ref: "#/components/schemas/FlowNode" } }
            edges:
              type: array
              items:
                type: object
                properties:
                  from: { type: string }
                  to: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    PanelEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Panel" }
        meta: { $ref: "#/components/schemas/Meta" }

    RunStage:
      type: object
      required: [seq, name, command]
      properties:
        seq: { type: integer }
        name: { type: string }
        command: { type: string }
        exitCode: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        logEvidenceId: { type: string, nullable: true }

    Run:
      type: object
      required: [id, taskId, attempt, status]
      properties:
        id: { type: string }
        taskId: { type: string }
        attempt: { type: integer }
        status: { type: string, enum: [queued, running, passed, failed, cancelled] }
        reason: { type: string }
        actor: { type: string }
        agentProfile: { type: string }
        changedFiles: { type: integer }
        startedAt: { type: string }
        finishedAt: { type: string }
        stages:
          type: array
          items: { $ref: "#/components/schemas/RunStage" }

    RunCreate:
      type: object
      properties:
        actor: { type: string }
        agentProfile: { type: string }
        localOverride:
          type: object
          description: 客户端本地 agent 覆盖（命令/模型），服务端按 policy 校验
          properties:
            adapter: { type: string }
            command: { type: string }
            model: { type: string }

    RunEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Run" }
        meta: { $ref: "#/components/schemas/Meta" }

    RunListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        meta: { $ref: "#/components/schemas/Meta" }

    Evidence:
      type: object
      required: [id, runId, kind, sha256, bytes]
      properties:
        id: { type: string }
        runId: { type: string }
        kind: { type: string, enum: [diff, log, result, manifest, changes] }
        sha256: { type: string }
        bytes: { type: integer }
        createdAt: { type: string }
        contentUrl: { type: string }

    EvidenceListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        meta: { $ref: "#/components/schemas/Meta" }

    AgentRoleConfig:
      type: object
      required: [adapter]
      properties:
        adapter: { type: string, enum: [openai-compatible, anthropic, cli, vscode-claude-code] }
        model: { type: string }
        command: { type: string }
        timeoutMs: { type: integer }
        maxRepairs: { type: integer }
        env:
          type: object
          additionalProperties: { type: string }

    AgentConfig:
      type: object
      required: [schemaVersion, roles, policy]
      properties:
        schemaVersion: { type: string, const: agent/v1 }
        schemaUrl: { type: string }
        roles:
          type: object
          properties:
            decomposer: { $ref: "#/components/schemas/AgentRoleConfig" }
            implementer: { $ref: "#/components/schemas/AgentRoleConfig" }
            reviewer: { $ref: "#/components/schemas/AgentRoleConfig" }
        routing:
          type: object
          properties:
            default: { type: string }
            byRole: { type: object, additionalProperties: { type: string } }
            byProject: { type: object, additionalProperties: { type: object } }
        policy:
          type: object
          properties:
            allowNetwork: { type: boolean }
            allowShell: { type: boolean }
            allowFileWrite:
              type: array
              items: { type: string, enum: [worktree, workspace, none] }
            maxTokensPerRun: { type: integer }
            denyGlobs: { type: array, items: { type: string } }
        readonly: { type: boolean, const: true }

    AgentConfigEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AgentConfig" }
        meta: { $ref: "#/components/schemas/Meta" }

    Event:
      type: object
      required: [id, kind, at]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [project.registered, card.updated, run.created, run.finished, evidence.archived]
        at: { type: string }
        projectId: { type: string }
        requirementId: { type: string }
        taskId: { type: string }
        runId: { type: string }
        payload: { type: object, additionalProperties: true }

    EventListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        meta: { $ref: "#/components/schemas/Meta" }
